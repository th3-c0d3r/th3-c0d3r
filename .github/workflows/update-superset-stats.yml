name: Update Superset Stats

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Fetch Superset Data
        run: |
          cat << 'EOF' > fetch_stats.py
          import requests
          import re

          # Fetching the raw structured markdown metadata endpoint directly
          url = "https://superset.sh/md/user/karthikeyan"
          headers = {'User-Agent': 'Mozilla/5.0'}
          response = requests.get(url, headers=headers)

          if response.status_code == 200:
              content = response.text

              # Robust Regex Extraction directly matching the text metadata elements
              rank = re.search(r'- Rank:\s*(.*)', content).group(1).strip()
              tier = re.search(r'- Tier:\s*(.*)', content).group(1).strip()
              tokens = re.search(r'- Tokens:\s*(.*)', content).group(1).strip()
              cost = re.search(r'- Cost:\s*(.*)', content).group(1).strip()
              sessions = re.search(r'- Sessions:\s*(.*)', content).group(1).strip()
              active_days = re.search(r'- Active days in the last year:\s*(.*)', content).group(1).strip()
              busiest_day = re.search(r'- Busiest day:\s*(.*)', content).group(1).strip()

              # Open README and swap the markdown blocks cleanly
              with open("README.md", "r") as f:
                  readme = f.read()

              start_marker = "<!-- SUPERSET-STATS:START -->"
              end_marker = "<!-- SUPERSET-STATS:END -->"

              # Building a native GitHub markdown table that will never fail to render
              table_template = f"""{start_marker}
          ### 📊 Live Superset AI Telemetry

          | Metric Category | Current Agent Value | Telemetry Context |
          | :--- | :--- | :--- |
          | **🏆 Leaderboard Rank** | `{rank}` | Tier: *{tier}* |
          | **🤖 Volume Handled** | `{tokens}` | Across `{sessions}` active agent sessions |
          | **💰 Compute Valuation** | `{cost}` | API-equivalent value consumed |
          | **⏳ Operational Run** | `{active_days} active days` | Peak load: `{busiest_day}` |

          *Last updated automatically via Superset Markdown endpoint API.*
          {end_marker}"""

              pattern = re.compile(rf"{start_marker}.*?{end_marker}", re.DOTALL)
              updated_readme = pattern.sub(table_template, readme)

              with open("README.md", "w") as f:
                  f.write(updated_readme)
              print("Markdown endpoints parsed and committed.")
          else:
              print(f"Failed to fetch telemetry document. Error code: {response.status_code}")
          EOF
          python fetch_stats.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-updated Superset metrics"
          git push
