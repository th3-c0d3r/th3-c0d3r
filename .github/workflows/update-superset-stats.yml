name: Update Superset Visuals
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Requirements
        run: pip install requests
        
      - name: Execute Script
        run: python parse_superset.py
        
      - name: Commit Back To Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "🤖 Synchronized Superset Grid & Models UI Layout"
          git push
